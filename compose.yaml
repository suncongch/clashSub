services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: 3xui
    restart: unless-stopped
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "false"
    volumes:
      - /volume1/docker/3xui/db:/etc/x-ui
      - /volume1/docker/3xui/cert:/root/cert
    ports:
      - "12053:2053"
      - "20936:20936"
      - "20937:20937"
