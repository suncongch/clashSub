<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>城市设计</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f0f0f0;
    }
  .container {
    display: flex;
    flex-direction: row;
    justify-content: space-between; /* 两列拉开 */
    align-items: flex-start;
    flex-wrap: wrap;
    width: 100%;
    box-sizing: border-box;
    padding: 32px 10px 16px; /* 缩小左右间距 */
    gap: 4%; /* 加大两图间距 */
    margin-bottom: 16px;
  }
    .image-box {
      width: 100%; /* 占满列 */
      aspect-ratio: 3 / 2; /* 调整为 16:9 缩小高度 */
      background-color: #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 2px solid #ccc;
      border-radius: 12px;
      position: relative;
    }
    /* 使含有按钮的图片容器可定位 */
  /* 新结构：图片+下方按钮/二维码 垂直堆叠 */
  .image-stack { flex:1 1 47.5%; width:47.5%; max-width:1100px; display:flex; flex-direction:column; align-items:center; }
    /* 响应式：窄屏单列 */
    @media (max-width: 1000px) {
      .image-stack { flex: 0 1 100%; width:100%; }
  .container { justify-content:center; gap:60px; } /* 竖版单列时加大上下间距 */
    }
  /* iPad / 中等宽度(横屏 1024 或接近) 优化：减小单块最大宽度并允许更灵活高度 */
  @media (min-width: 820px) and (max-width: 1180px){
    /* 横屏平板：保持双列，适度缩小高度与间距 */
    .container { gap:3%; padding-top:24px; }
    .image-stack { width:47%; flex:1 1 47%; }
    .image-box { aspect-ratio:16 / 9; max-height:55vh; }
  }
  /* 竖屏 iPad 或大屏手机 (宽度 768-819) 单列但缩小整体顶部/间距，避免图片过高 */
  @media (min-width: 768px) and (max-width: 819px){
    .container { gap:40px; }
    .image-stack { width:88%; flex:0 1 88%; }
    .image-box { aspect-ratio: 4 / 3; }
  }
  /* 更小设备保持 3:2 但限制最大高度，避免“过大”感觉 */
  @media (max-width: 767px){
    .image-box { aspect-ratio: 3 / 2; max-height: 55vh; }
  }
  .image-actions { margin-top:16px; display:flex; flex-direction:column; align-items:flex-end; justify-content:flex-start; gap:10px; width:100%; }
  .gen-buttons-row { display:flex; flex-direction:row; gap:10px; justify-content:flex-end; width:100%; }
  .gen-status { font-size:30px; color:#333; min-width:110px; text-align:left; line-height:1.1; }
  .inline-qr-small { position:relative; }
  #generationStatus { position:static; font-size:12px; line-height:1.3; background:transparent; padding:0; margin-top:6px; box-sizing:border-box; min-height:16px; color:#333; }
  .status-qr-row { display:flex; flex-direction:row; align-items:flex-start; gap:14px; width:100%; justify-content:space-between; margin-top:4px; }
  .status-qr-row .gen-status { flex:1 1 auto; }
  .prompt-line { font-size:24px; color:#555; margin-top:6px; line-height:1.18; word-break:break-all; }
  .status-left { display:flex; flex-direction:column; align-items:flex-start; flex:1 1 auto; }
  /* 统一两个按钮宽度 */
  .image-actions button { width:150px; }
  .image-actions button { padding: 15px 25px; font-size:18px; border:none; border-radius:8px; background:#007bff; color:#fff; cursor:pointer; }
  .image-actions button:hover { background:#0056b3; }
  .image-actions .inline-qr-small { width:130px; background:#fff; border:2px solid #ccc; border-radius:10px; padding:6px 6px 10px; display:flex; flex-direction:column; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
  .image-actions .inline-qr-small img { width:110px; height:110px; object-fit:contain; }
  .image-actions .inline-qr-small .qr-label { font-size:12px; margin:4px 0 0; }
    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
    }
  .controls {
    display: flex;
    justify-content: center;
    gap: 120px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }
  .action-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    min-width: 160px;
  }
  .controls button {
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background-color: #007bff;
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    transition: background .25s, transform .15s;
    width: 180px;
  }
  .controls button:hover { background-color: #0056b3; }
  .controls button:active { transform: translateY(2px); }

  /* 内嵌二维码样式（重用原 qr-code 基础外观稍作压缩） */
  .inline-qr {
    width: 130px;
    background: white;
    border: 2px solid #ccc;
    border-radius: 10px;
    padding: 6px 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .inline-qr img { width: 110px; height: 110px; object-fit: contain; }
  .inline-qr .qr-label { font-size: 12px; margin: 4px 0 0; }

  /* 响应式：窄屏改为纵向堆叠，并让二维码与按钮保持紧凑 */
  @media (max-width: 900px) {
    .controls { gap: 60px; }
  }
  @media (max-width: 650px) {
    .controls { flex-direction: column; gap: 30px; }
    .action-block { width: 100%; }
  }

    input[type="file"] {
      display: none;
    }

    /* 预览弹窗样式 */
    .overlay {
      position: fixed;
      top: -40px;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9000;
    }

    .overlay img {
      max-width: 90%;
      max-height: 90%;
      box-shadow: 0 0 20px rgba(255,255,255,0.6);
      border-radius: 10px;
    }

    /* 局部 loading 覆盖在第二张图上 */
    .loading-overlay-local {
      position: absolute;
      bottom: 8px;
      left: 8px;
      width: 60px;
      height: 60px;
      display: none;
      background: transparent; /* 全透明背景 */
      z-index: 20;
      justify-content: center;
      align-items: center;
      pointer-events: none; /* 不阻挡点击放大 */
    }

    .corner-label {
        position: fixed;
        bottom: 30px;
        left: 50px;
        background-color: rgba(0, 0, 0, 0.6);
        color: white;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 20px;
        font-family: sans-serif;
        font-weight: 500;
        line-height: 1.6;
        z-index: 1001;
        pointer-events: none;
        text-align: left;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid #f3f3f3;
      border-top: 6px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .qr-container {
  position: fixed;
  bottom: 60px;
  right: 90px;
  display: flex;
  gap: 380px;
  z-index: 999;
}

.qr-code {
  width: 120px;
  height: 140px;
  border-radius: 8px;
  background: white;
  border: 2px solid #ccc;
  padding: 5px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.qr-code img {
  width: 100px;
  height: 100px;
  object-fit: contain;
  margin-top: 10px;
}

.qr-label {
  font-size: 12px;
  margin-bottom: 5px;
}

.background-image {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('static/image/background.jpg');
  background-size: cover;
  background-position: center;
  z-index: -1; /* 保证它在最底层 */
  opacity: 1; /* 可根据需要调整透明度 */
}

.main-wrapper {
  width: 90%;
  max-width: 1800px;
  margin: 0 auto; /* 顶部间距改为 JS 动态控制 */
  box-sizing: border-box;
  transition: margin-top .25s ease;
}
  /* 调试面板 */
  .backend-switch { position:fixed; top:8px; right:12px; background:rgba(0,0,0,0.55); color:#fff; padding:6px 10px 8px; border-radius:6px; font-size:12px; z-index:12000; display:flex; gap:6px; align-items:center; backdrop-filter: blur(4px); }
  .backend-switch select { background:#222; color:#fff; border:1px solid #555; border-radius:4px; padding:2px 4px; font-size:12px; }
  .backend-switch .env-indicator { font-weight:600; padding:2px 6px; border-radius:4px; background:#007bff; }
  .backend-switch.hidden { display:none; }
/* 占位：在极窄或高度不足时允许内容紧贴顶部 */
@media (max-height:600px){
  .main-wrapper { transition: none; }
}

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

        /* === 统一高度限制覆盖：不超过视口高度 70% === */
        .image-box { max-height:70vh !important; }
        .image-box img, .image-box video { max-height:70vh !important; }

  /* === 手机竖屏紧凑布局：上下单列，压缩高度尽量一屏展示 === */
  @media (orientation: portrait) and (max-width: 768px),
         (max-aspect-ratio: 3/4) and (max-width: 768px) {
    .background-image {
        background-image:url('static/image/background-portrait.jpg');
        width: 100vw;
        height: 100vh;
        background-size: 100% auto;
        background-position: center top;
    }
    .main-wrapper { width: 96%; }
    .container {
      flex-direction: column;
      gap: 14px;
      padding: 16px 12px 8px;
      margin-bottom: 8px;
    }
    .image-stack {
      width: 100%;
      flex: 0 0 auto;
      max-width: none;
    }
    .image-box {
      aspect-ratio: 4 / 3;
      max-height: 32vh !important;
    }
    .image-box img,
    .image-box video {
      max-height: 30vh !important;
    }
    .image-stack:first-child .image-actions {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .image-stack:last-child .image-actions {
      margin-top: 8px;
      gap: 6px;
      align-items: stretch;
    }
    .image-actions {
      margin-top: 8px;
    }
    .image-actions button {
      width: auto;
      padding: 10px 14px;
      font-size: 14px;
    }
    .gen-buttons-row {
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-start;
    }
    .gen-status {
      font-size: 14px;
      min-width: 0;
    }
    #generationStatus { font-size: 12px; }
    .prompt-line { font-size: 14px; margin-top: 4px; }
    .status-qr-row {
      gap: 8px;
      margin-top: 2px;
    }
    .image-actions .inline-qr-small {
      width: 100px;
      padding: 4px 4px 6px;
      flex-shrink: 0;
    }
    .image-actions .inline-qr-small img {
      width: 80px;
      height: 80px;
    }
    .image-actions .inline-qr-small .qr-label { font-size: 10px; }
    .corner-label {
      position: relative;
      bottom: auto;
      left: auto;
      margin-bottom: 4px;
      font-size: 14px;
      padding: 6px 10px;
      line-height: 1.4;
    }
    .backend-switch {
      flex-wrap: wrap;
      max-width: calc(100vw - 16px);
    }
  }

  </style>
</head>

  <input type="file" id="cameraInput" accept="image/*" capture="environment">

  <!-- 放大预览遮罩 -->
  <div class="overlay" id="overlay" onclick="this.style.display='none'">
    <img id="overlayImg" src="" alt="放大图像" />
  </div>

  <!-- Loading 动画 -->
  <!-- 局部 Loading 覆盖层放到 image2 容器内部（通过脚本插入） -->

  <script>
    // ===== 后端环境配置（可扩展）=====
    const BACKEND_PRESETS = [
      { label:'生产Prod', value:'https://www.andysun.cool:9000', mode:'prod' },
      { label:'备用9002', value:'https://www.andysun.cool:9002', mode:'prod' },
      { label:'本地开发9001', value:'http://localhost:9001', mode:'dev' },
      { label:'本地127.0.0.1', value:'http://127.0.0.1:9001', mode:'dev' }
    ];
    let BACKEND_BASE = BACKEND_PRESETS[0].value; // 默认生产
    let DEBUG_MODE = false;
    let IMAGES_LOADED = false; // 控制是否已按需加载初始图片
    // ===== Backend switch settings persistence =====
    const BACKEND_SETTINGS_KEY = 'backend_switch_settings_v1';
    function loadBackendSettings(){
      try {
        const raw = localStorage.getItem(BACKEND_SETTINGS_KEY);
        if(!raw) return null;
        const obj = JSON.parse(raw);
        return obj && typeof obj==='object' ? obj : null;
      }catch(e){ return null; }
    }
    function saveBackendSettings(){
      try {
        const sel = document.getElementById('backendSelect');
        const auto = document.getElementById('autoGenToggle');
        const chain = document.getElementById('chainModeToggle');
        const maxStepsEl = document.getElementById('maxStepsInput');
        const fpsEl = document.getElementById('fpsInput');
        const holdEl = document.getElementById('holdFramesInput');
        const transEl = document.getElementById('transitionFramesInput');
        const timeoutEl = document.getElementById('timeoutInput');
        const dbgEl = document.getElementById('toggleDebug');
        const mergeEl = document.getElementById('mergePromptInput');
        const data = {
          backend: sel?.value || BACKEND_BASE,
          auto: !!auto?.checked,
          chain: !!chain?.checked,
          maxSteps: parseInt(maxStepsEl?.value)||MAX_STEPS,
          fps: parseInt(fpsEl?.value)||30,
          hold: parseInt(holdEl?.value)||15,
          transition: parseInt(transEl?.value)||30,
          timeout: parseInt(timeoutEl?.value)||TIMEOUT_SECONDS,
          debug: !!dbgEl?.checked,
          mergePrompt: (mergeEl?.value||'').trim()
        };
        localStorage.setItem(BACKEND_SETTINGS_KEY, JSON.stringify(data));
      }catch(e){}
    }
    function applyBackendBase(){
      const img1 = document.getElementById('image1');
      const img2 = document.getElementById('image2');
      if(img1 && img1.dataset.rel){ img1.src = BACKEND_BASE + img1.dataset.rel; }
      if(img2 && img2.dataset.rel){ img2.src = BACKEND_BASE + img2.dataset.rel; }
      // 如果尚未有上传文件，用当前节点的默认 block1.jpg 作为“拍摄图像”二维码内容
      if(!uploadedFilename){
        const qrUpload = document.getElementById('qrImageUpload');
        if(qrUpload){
          const defaultUploadUrl = BACKEND_BASE + '/static/image/block1.jpg';
            const encoded = encodeURIComponent(defaultUploadUrl);
            qrUpload.src = 'https://api.qrserver.com/v1/create-qr-code/?data=' + encoded + '&size=120x120';
        }
      } else {
        updateQRCodeUpload(uploadedFilename);
      }
      // 更新结果二维码为当前第二张图（若已存在）
      if(img2 && img2.src){ updateQRCodeResult(img2.src); }
    }
    function setEnvIndicator(){
      const ind = document.getElementById('envIndicator');
      ind.textContent = DEBUG_MODE ? 'DEBUG' : 'PROD';
      ind.style.background = DEBUG_MODE ? '#d97706' : '#007bff';
    }
    function loadInitialImagesIfNeeded(force){
      if(IMAGES_LOADED && !force) return;
      IMAGES_LOADED = true;
      applyBackendBase();
    }

    function initBackendSwitch(){
      const sel = document.getElementById('backendSelect');
      const toggle = document.getElementById('toggleDebug');
  const maxStepsInput = document.getElementById('maxStepsInput');
  const autoToggle = document.getElementById('autoGenToggle');
  const chainToggle = document.getElementById('chainModeToggle');
  const fpsInputEl = document.getElementById('fpsInput');
  const holdInputEl = document.getElementById('holdFramesInput');
  const transInputEl = document.getElementById('transitionFramesInput');
  const timeoutInputEl = document.getElementById('timeoutInput');
      // 先加载本地保存
  const stored = loadBackendSettings();
      if(stored){
        // backend
        if(stored.backend && BACKEND_PRESETS.some(p=>p.value===stored.backend)){
          sel.value = stored.backend; BACKEND_BASE = stored.backend;
        }
        // debug
        if(typeof stored.debug==='boolean'){ DEBUG_MODE = stored.debug; toggle.checked = stored.debug; }
        // auto
        if(typeof stored.auto==='boolean'){ AUTO_GENERATE = stored.auto; autoToggle.checked = stored.auto; }
  // chain
  if(typeof stored.chain==='boolean'){ CHAIN_MODE = stored.chain; if(chainToggle) chainToggle.checked = stored.chain; }
        // max steps
        if(Number.isInteger(stored.maxSteps) && stored.maxSteps>0){ MAX_STEPS = Math.min(50, stored.maxSteps); maxStepsInput.value = MAX_STEPS; }
        // video params
        if(Number.isInteger(stored.fps) && stored.fps>0){ fpsInputEl.value = stored.fps; }
        if(Number.isInteger(stored.hold) && stored.hold>0){ holdInputEl.value = stored.hold; }
        if(Number.isInteger(stored.transition) && stored.transition>0){ transInputEl.value = stored.transition; }
  if(Number.isInteger(stored.timeout) && stored.timeout>0){ timeoutInputEl.value = stored.timeout; TIMEOUT_SECONDS = stored.timeout; }
    const mpEl = document.getElementById('mergePromptInput');
    if(mpEl){ mpEl.value = (typeof stored.mergePrompt==='string' && stored.mergePrompt.trim()) ? stored.mergePrompt : '合并所有不同的部分'; }
      }
      // 解析 URL 参数（只定义一次 params）
      const params = new URLSearchParams(window.location.search);
      const ms = params.get('maxsteps');
      if(ms && !isNaN(Number(ms))) { MAX_STEPS = Math.max(1, parseInt(ms)); }
      const ag = params.get('autogen');
      if(ag === '0') { AUTO_GENERATE = false; }
  maxStepsInput.value = MAX_STEPS;
      // 用户显式切换才加载（首次如果仍是生产，需要一次“确认”操作）
      sel.addEventListener('change', e => {
        const prev = BACKEND_BASE;
        BACKEND_BASE = sel.value;
        // 每次真实变更后端都重新加载图片（若尚未加载则现在加载）
        loadInitialImagesIfNeeded(true);
        fetchConfig();
        saveBackendSettings();
      });

      // 如果默认就选中生产，但用户尚未执行交互，不去加载图片。
      // 用户再次点击当前选项（无 change 事件）时无法捕获，这里可增加一次点击监听。
      sel.addEventListener('click', () => {
        if(!IMAGES_LOADED && sel.value === BACKEND_PRESETS[0].value){
          loadInitialImagesIfNeeded(true);
          fetchConfig();
          saveBackendSettings();
        }
      });
  toggle.addEventListener('change', e => {
        DEBUG_MODE = toggle.checked;
        setEnvIndicator();
        document.getElementById('backendSwitch').classList.toggle('debug-on', DEBUG_MODE);
  saveBackendSettings();
      });
  const mergeEl = document.getElementById('mergePromptInput');
  if(mergeEl){ mergeEl.addEventListener('change', ()=>{ saveBackendSettings(); }); }
      maxStepsInput.addEventListener('change', () => {
        const v = parseInt(maxStepsInput.value);
        if(!isNaN(v) && v > 0){ MAX_STEPS = Math.min(50, v); maxStepsInput.value = MAX_STEPS; }
  saveBackendSettings();
      });
      autoToggle.addEventListener('change', () => {
        const val = autoToggle.checked;
        AUTO_GENERATE = val;
        // 更新后端
        fetch(BACKEND_BASE + '/generation_config', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ autoGenerate: val })
        }).catch(()=>{});
  saveBackendSettings();
      });
  if(chainToggle){ chainToggle.addEventListener('change', ()=>{ CHAIN_MODE = !!chainToggle.checked; saveBackendSettings(); }); }
  // 视频参数变更持久化
  ;[fpsInputEl, holdInputEl, transInputEl].forEach(el=>{
    if(el){ el.addEventListener('change', ()=>{ saveBackendSettings(); }); }
  });
  if(timeoutInputEl){ timeoutInputEl.addEventListener('change', ()=>{ const v=parseInt(timeoutInputEl.value); if(!isNaN(v)&&v>0){ TIMEOUT_SECONDS = Math.min(600, Math.max(5,v)); timeoutInputEl.value = TIMEOUT_SECONDS; } saveBackendSettings(); }); }
  // 允许通过 URL 参数 ?debug=1 自动开启 (复用已定义 params)
      if(params.get('debug')==='1'){ toggle.checked = true; DEBUG_MODE = true; }
      setEnvIndicator();
  // 直接按保存的(或默认)节点加载初始图片
  fetchConfig();
  loadInitialImagesIfNeeded(true);
  saveBackendSettings();
    }
    window.addEventListener('DOMContentLoaded', initBackendSwitch);

    const input = document.getElementById('cameraInput');
    const image1 = document.getElementById('image1');
    const image2 = document.getElementById('image2');
    const overlay = document.getElementById('overlay');
    const overlayImg = document.getElementById('overlayImg');
    // const loading = document.getElementById('loading'); // replaced by local overlay
    const loadingLocal = document.getElementById('loadingLocal');

    let uploadedFilename = null;
    let uploadedBase64 = null; // 保存最近上传的原始(压缩后)base64，供递归生成使用
    let AUTO_GENERATE = true; // 上传后是否自动递归生成
    let MAX_STEPS = 3; // 默认递归生成步数，可用 ?maxsteps=5 调整
  let TIMEOUT_SECONDS = 60; // 后端读取/推理超时（秒）
    let CHAIN_MODE = false; // 是否链式：上一步的输出作为下一步输入
    let IS_GENERATING = false; // 当前是否在递归生成
  let CURRENT_TASK_ID = null; // 后端异步任务ID
  let generationSource = null; // SSE EventSource
  let EXPECTED_STEPS = 0; // 预计总步数
  let MODE_LABEL = '';
  let CURRENT_PROMPT = '';
  let LAST_COMPLETED_TASK_ID = null;
    let CUSTOM_PROMPTS = [];
    const DEFAULT_PROMPTS = [
      '保持图片所有其他的元素不变，把红色方块变成广告和媒体界面',
      '保持图片所有其他的元素不变，把绿色方块变成绿植',
      '保持图片所有其他的元素不变，把灰色方块变成市民休闲设置',
      '保持图片所有其他的元素不变，把黑色方块变成公共艺术和雕塑',
      '保持图片所有其他的元素不变，把橙色方块变成集市摊位',
      '保持图片所有其他的元素不变，把蓝色方块变成喷泉或水池',
      '保持图片所有其他的元素不变，把黄色方块变成台阶或坡道',
      '保持图片所有其他的元素不变，把白色方块变成建筑物',
      '保持图片所有其他的元素不变，把棕色方块变成木栈道铺装',
      '棋盘格变成城市地面，背景变成城市景观'
    ];
    // Local persistence for custom prompts
    const PROMPTS_KEY = 'custom_prompts_v1';
    function loadPrompts(){
      try {
        const raw = localStorage.getItem(PROMPTS_KEY);
        if(raw){
          const arr = JSON.parse(raw);
          if(Array.isArray(arr)){
            const filtered = arr.filter(x=> typeof x==='string' && x.trim());
            if(filtered.length){ CUSTOM_PROMPTS = filtered; }
          }
        }
      } catch(e) { /* ignore */ }
    }
    function savePrompts(){
      try {
        if(CUSTOM_PROMPTS.length){ localStorage.setItem(PROMPTS_KEY, JSON.stringify(CUSTOM_PROMPTS)); }
        else { localStorage.removeItem(PROMPTS_KEY); }
      } catch(e) { /* ignore */ }
    }
    loadPrompts();

    // ===== Corner Label Editable & Persistence =====
    const CORNER_LABEL_KEY = 'corner_label_lines_v1';
    const CORNER_DEFAULT_LINES = ['城市设计','陈瑜','北京市规划馆'];
    function loadCornerLabel(){
      try {
        const raw = localStorage.getItem(CORNER_LABEL_KEY);
        if(raw){
          const arr = JSON.parse(raw);
          if(Array.isArray(arr) && arr.length===3){
            arr.forEach((t,i)=>{ if(typeof t!=='string'||!t.trim()) arr[i]=CORNER_DEFAULT_LINES[i]; });
            setCornerLines(arr);
            return;
          }
        }
      }catch(e){}
      setCornerLines(CORNER_DEFAULT_LINES.slice());
    }
    function saveCornerLabel(){
      const lines = [
        document.getElementById('cornerLine1').textContent,
        document.getElementById('cornerLine2').textContent,
        document.getElementById('cornerLine3').textContent
      ];
      try { localStorage.setItem(CORNER_LABEL_KEY, JSON.stringify(lines)); } catch(e){}
    }
    function setCornerLines(arr){
      document.getElementById('cornerLine1').textContent = arr[0];
      document.getElementById('cornerLine2').textContent = arr[1];
      document.getElementById('cornerLine3').textContent = arr[2];
    }
    function openLabelEditor(){
      const l1 = document.getElementById('cornerLine1').textContent;
      const l2 = document.getElementById('cornerLine2').textContent;
      const l3 = document.getElementById('cornerLine3').textContent;
      document.getElementById('cornerLineInput1').value = l1;
      document.getElementById('cornerLineInput2').value = l2;
      document.getElementById('cornerLineInput3').value = l3;
    }
    window.addEventListener('DOMContentLoaded', loadCornerLabel);

    function cacheBust(url){
      if(!url) return url;
      return url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
    }

    function updateGenerationStatus(text, color){
      const el = document.getElementById('generationStatus');
      if(!el) return;
      el.textContent = text || '';
      if(color) el.style.color = color; else el.style.color = '#333';
    }
    function updateCurrentPrompt(p){ /* 暂停显示当前提示词 */ return; }
  function notify(msg, color){ updateGenerationStatus(msg, color); }

    function setGenerating(state){
      IS_GENERATING = state;
      const takeBtn = document.getElementById('takePhotoBtn');
      const aiBtn = document.getElementById('aiProcessBtn');
      const maxInput = document.getElementById('maxStepsInput');
  const cancelBtn = document.getElementById('cancelGenBtn');
      [takeBtn, aiBtn, maxInput].forEach(el => { if(el) el.disabled = state; });
      if(aiBtn){ aiBtn.textContent = state ? '生成中...' : 'AI图像处理'; }
  const genVideoBtn = document.getElementById('generateVideoBtn');
  if(genVideoBtn && state){ genVideoBtn.style.display='none'; }
  const videoEl = document.getElementById('video2');
  const img2El = document.getElementById('image2');
  if(state){
    // 新一轮生成：隐藏视频，恢复静态图容器
    if(videoEl){ videoEl.pause(); videoEl.style.display='none'; }
    if(img2El){ img2El.style.display='block'; }
  }
  if(cancelBtn){ cancelBtn.style.display = state ? 'inline-block' : 'none'; cancelBtn.disabled = !state; }
    }

    async function fetchConfig(){
      try {
        const res = await fetch(BACKEND_BASE + '/generation_config');
        if(!res.ok) return;
        const data = await res.json();
        if(data.status==='success' && data.config){
          AUTO_GENERATE = !!data.config.auto_generate;
          const autoToggle = document.getElementById('autoGenToggle');
          if(autoToggle) autoToggle.checked = AUTO_GENERATE;
        }
      }catch(e){ /* 忽略 */ }
    }

    function takePhoto() {
      input.click();
    }

    input.onchange = async function () {
  if(IS_GENERATING){ notify('生成中，稍候再上传', '#d97706'); return; }
      const file = input.files[0];
      if (!file) return;

      const img = new Image();
      const reader = new FileReader();

      reader.onload = function (e) {
        img.src = e.target.result;
      };

      reader.readAsDataURL(file);

      img.onload = async function () {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        const MAX_WIDTH = 800;
        const scale = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scale;

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  const base64 = canvas.toDataURL('image/jpeg', 0.7);
  uploadedBase64 = base64; // 记录
  image1.src = base64;
  // 需求：上传后 image2 也先显示原图（在生成首步之前展示原始）
  image2.src = base64;
  updateQRCodeResult(base64); // 二维码同步为当前原图（注意：若需保持旧AI结果可移除这一行）

        try {
    const res = await fetch(BACKEND_BASE + '/upload_base64', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64 })
          });

          const result = await res.json();
          if (result.status === "success") {
            uploadedFilename = result.filename;
            updateQRCodeUpload(uploadedFilename);
            // 也可以将 image2 切换为可访问的静态原图 URL（更利于分享）
            const staticOriginalUrl = `${BACKEND_BASE}/static/uploaded_images/${uploadedFilename}`;
            image2.src = staticOriginalUrl;
            updateQRCodeResult(staticOriginalUrl);
            if (AUTO_GENERATE) {
              startRecursiveGeneration();
            } else {
              notify('上传完成', '#007bff');
            }
          } else {
            notify('上传失败', '#d9534f');
          }
        } catch (error) {
          notify('网络错误', '#d9534f');
          console.error(error);
        }
      };
    };

    async function startRecursiveGeneration(){
      // 兼容旧名称，内部走 SSE 异步
      return startAsyncGenerationSSE();
    }

    async function startAsyncGenerationSSE(){
  if(!uploadedBase64){ notify('请先上传图片', '#d9534f'); return; }
  if(IS_GENERATING){ notify('已有生成任务', '#d97706'); return; }
      setGenerating(true);
      loadingLocal.style.display = 'flex';
      updateGenerationStatus('启动中...', '#007bff');
      try {
    const promptsToSend = (CUSTOM_PROMPTS && CUSTOM_PROMPTS.length>0) ? CUSTOM_PROMPTS.slice(0) : undefined;
  const payload = { image: uploadedBase64, maxSteps: MAX_STEPS, timeout: TIMEOUT_SECONDS };
  const mpEl = document.getElementById('mergePromptInput');
  if(mpEl && mpEl.value.trim()) { payload.mergePrompt = mpEl.value.trim(); }
  if(typeof CHAIN_MODE === 'boolean'){ payload.chainPrompts = CHAIN_MODE; }
    if(promptsToSend){ payload.prompts = promptsToSend; }
        const ctrl = new AbortController();
        const to = setTimeout(()=>{ ctrl.abort(); }, Math.min( (TIMEOUT_SECONDS+5)*1000, 600000));
        let res;
        try {
          res = await fetch(BACKEND_BASE + '/start_generation', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            signal: ctrl.signal
          });
        } finally { clearTimeout(to); }
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if(data.status !== 'started'){ throw new Error(data.message || '启动失败'); }
        CURRENT_TASK_ID = data.taskId;
        EXPECTED_STEPS = data.maxSteps || MAX_STEPS;
  updateGenerationStatus(`进度 0 / ${EXPECTED_STEPS}`, '#007bff');
  updateCurrentPrompt('');
        // 打开 SSE
        const sseUrl = BACKEND_BASE + '/generation_events?taskId=' + encodeURIComponent(CURRENT_TASK_ID);
        if(generationSource){ generationSource.close(); }
        generationSource = new EventSource(sseUrl);
        generationSource.onmessage = ev => {
          try {
            const msg = JSON.parse(ev.data);
            if(msg.cancelled){
              updateGenerationStatus('已取消', '#d9534f');
              finishGeneration();
              return;
            }
            // 最终合并图像到达时，直接显示在右侧 image2
            if(msg.final && msg.url){
              image2.src = cacheBust(msg.url);
              updateQRCodeResult(msg.url);
              updateGenerationStatus(`合并完成 ${EXPECTED_STEPS} / ${EXPECTED_STEPS}`, '#28a745');
            }
            if(msg.done){
              updateGenerationStatus(`完成 ${EXPECTED_STEPS} / ${EXPECTED_STEPS}`, '#28a745');
              LAST_COMPLETED_TASK_ID = CURRENT_TASK_ID;
              updateCurrentPrompt('');
              finishGeneration();
              // 显示生成视频按钮
              const genVideoBtn = document.getElementById('generateVideoBtn');
              if(genVideoBtn){ genVideoBtn.style.display='inline-block'; }
              return;
            }
            if(typeof msg.step === 'number' && msg.url){
              image2.src = cacheBust(msg.url);
              updateQRCodeResult(msg.url);
              const stepNo = msg.step + 1; // 人类可读
              updateGenerationStatus(`进度 ${stepNo} / ${EXPECTED_STEPS}`, '#007bff');
              if(msg.prompt){ updateCurrentPrompt(msg.prompt); }
            }
          } catch(err){ console.warn('SSE parse error', err); }
        };
        generationSource.onerror = err => {
          console.error('SSE 错误', err);
          updateGenerationStatus('SSE错误或中断', '#d9534f');
          updateCurrentPrompt('');
          finishGeneration();
        };
      } catch(e){
  console.error('启动生成失败', e);
        updateGenerationStatus('启动失败', '#d9534f');
        updateCurrentPrompt('');
        finishGeneration();
      }
    }

    function finishGeneration(){
  if(generationSource){ try{ generationSource.close(); }catch(_){} generationSource=null; }
      CURRENT_TASK_ID = null;
      loadingLocal.style.display = 'none';
      setGenerating(false);
    }

    async function generateVideo(){
      if(!LAST_COMPLETED_TASK_ID){ updateGenerationStatus('暂无可生成步骤', '#d9534f'); return; }
      updateGenerationStatus('生成视频中...', '#007bff');
      try {
        const fpsVal = parseInt(document.getElementById('fpsInput')?.value)||30;
        const holdVal = parseInt(document.getElementById('holdFramesInput')?.value)||15;
        const transVal = parseInt(document.getElementById('transitionFramesInput')?.value)||30;
        const res = await fetch(BACKEND_BASE + '/generate_video', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ taskId: LAST_COMPLETED_TASK_ID, fps: fpsVal, holdFrames: holdVal, transitionFrames: transVal })
        });
        const data = await res.json();
        if(data.status==='success' && data.videoUrl){
          updateGenerationStatus('视频完成', '#28a745');
          const isMp4 = data.videoUrl.endsWith('.mp4');
          if(isMp4){
            const videoEl = document.getElementById('video2');
            if(videoEl){
              videoEl.src = data.videoUrl + (data.videoUrl.includes('?')?'&':'?') + '_t=' + Date.now();
              videoEl.style.display='block';
              image2.style.display='none';
              videoEl.play().catch(()=>{});
            }
          } else {
            image2.src = data.videoUrl + (data.videoUrl.includes('?')?'&':'?') + '_t=' + Date.now();
          }
          // 生成一个可下载的二维码链接（使用新的 /download_video 接口）
          const urlObj = new URL(data.videoUrl);
          // 从 videoUrl 推断 taskId (videoUrl 形如 .../static/runs/<taskId>/steps/steps.mp4)
          const parts = urlObj.pathname.split('/').filter(Boolean);
          let taskIdGuess = null;
          const idx = parts.findIndex(p=> p==='runs');
          if(idx !== -1 && parts.length > idx+1){ taskIdGuess = parts[idx+1]; }
          if(taskIdGuess){
            const downloadUrl = BACKEND_BASE + '/download_video?taskId=' + encodeURIComponent(taskIdGuess);
            updateQRCodeResult(downloadUrl);
          } else {
            updateQRCodeResult(data.videoUrl);
          }
        } else {
          updateGenerationStatus('视频失败', '#d9534f');
        }
      } catch(e){
        updateGenerationStatus('视频错误', '#d9534f');
      }
    }

    function cancelGeneration(){
      if(!IS_GENERATING) return;
      if(!CURRENT_TASK_ID){ finishGeneration(); return; }
      updateGenerationStatus('取消中...', '#d97706');
      fetch(BACKEND_BASE + '/cancel_generation', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ taskId: CURRENT_TASK_ID })
      }).then(r=>r.json()).then(resp=>{
        updateGenerationStatus('已请求取消', '#d9534f');
        // 等待 SSE 最终 cancelled 事件，如果已断开则直接结束
        setTimeout(()=>{ if(IS_GENERATING) finishGeneration(); }, 1500);
      }).catch(err=>{
        console.warn('取消失败', err);
        updateGenerationStatus('取消失败(本地停止)', '#d9534f');
        finishGeneration();
      });
    }

    function updateQRCodeResult(url) {
      const qrImg = document.getElementById('qrImageResult');
      if(!qrImg || !url) return;
      let finalUrl = url;
      // 若是 data URL，不适合作二维码内容，回退为上传或默认模板
      if(finalUrl.startsWith('data:')) {
        if(uploadedFilename) {
          finalUrl = `${BACKEND_BASE}/static/uploaded_images/${uploadedFilename}`;
        } else {
          const img2 = document.getElementById('image2');
          if(img2 && img2.dataset.rel) {
            finalUrl = BACKEND_BASE + img2.dataset.rel;
          } else { return; }
        }
      } else if(finalUrl.startsWith('/')) {
        finalUrl = BACKEND_BASE + finalUrl;
      }
      // 视频生成后多次刷新时如果 URL 相同，加时间戳避免二维码缓存不更新
      const stamp = Date.now();
      const qrData = encodeURIComponent(finalUrl);
      qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?data=${qrData}&size=120x120&_t=${stamp}`;
    };

    function updateQRCodeUpload(fileName) {
      if(!fileName) return;
      const clean = fileName.replace(/^\/+/, '');
      const fullUrl = `${BACKEND_BASE}/static/uploaded_images/${clean}`;
      const qrImg = document.getElementById('qrImageUpload');
      if(!qrImg) return;
      const encodedUrl = encodeURIComponent(fullUrl);
      // 加入时间戳防止浏览器缓存，确保上传后立即刷新二维码图像
      qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?data=${encodedUrl}&size=120x120&_t=${Date.now()}`;
    };

    async function runImg2Img() {
  if(IS_GENERATING){ notify('生成中', '#d97706'); return; }
  if (!uploadedFilename) { notify('请先上传图像', '#d9534f'); return; }

      const payload = {
        execute: true,
        uploadImageName: uploadedFilename,
        crossValue0: 0.25,
        controlNetType: "canny",
        model: "i2i_xl_sft",
        cfg: 5.0
      };

      loadingLocal.style.display = "flex"; // 显示loading

      try {
  const res = await fetch(BACKEND_BASE + '/img2img', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        console.log('img2img 返回:', result);
        loadingLocal.style.display = "none"; // 关闭loading

        if (result.status === "success" && result.imgUrl) {
          image2.src = result.imgUrl;
          updateQRCodeResult(result.imgUrl);
          notify('处理完成', '#28a745');
        } else {
          notify('处理失败', '#d9534f');
        }
      } catch (error) {
        loadingLocal.style.display = "none";
        notify('调用失败', '#d9534f');
        console.error(error);
      }
    }

    // 第二张图点击放大
    image2.onclick = function () {
      if (image2.src && !image2.src.includes("placeholder")) {
        overlayImg.src = image2.src;
        overlay.style.display = 'flex';
      }
    };
    // 第二张图点击放大
    image1.onclick = function () {
      if (image1.src && !image1.src.includes("placeholder")) {
        overlayImg.src = image1.src;
        overlay.style.display = 'flex';
      }
    };

    // 动态顶部间距：根据视口高度和内容高度，尝试垂直居中；空间不足时自动压缩
    function adjustTopMargin(){
      const wrapper = document.querySelector('.main-wrapper');
      if(!wrapper) return;
      const isPhonePortrait = window.matchMedia('(orientation: portrait) and (max-width: 768px)').matches;
      if(isPhonePortrait){
        wrapper.style.marginTop = '8px';
        return;
      }
      const vh = window.innerHeight;
      const contentH = wrapper.scrollHeight;
      const minTop = 8; // 最小顶部间距 px
      const target = Math.max(minTop, Math.floor((vh - contentH) / 2));
      // 如果内容高度大于视口，使用最小顶部间距
      wrapper.style.marginTop = (contentH > vh ? minTop : target) + 'px';
    }
    window.addEventListener('resize', adjustTopMargin);
    window.addEventListener('orientationchange', adjustTopMargin);
    window.addEventListener('load', adjustTopMargin);
    // 图片加载后再调整一次（防止初始尺寸变化导致跳动）
    window.setTimeout(adjustTopMargin, 300);
  // ===== Prompts 面板逻辑 =====
  const promptsPanel = document.getElementById('promptsPanel');
  const togglePromptsBtn = document.getElementById('togglePromptsPanel');
  const closePromptsBtn = document.getElementById('closePromptsPanel');
  const promptsList = document.getElementById('promptsList');
  const addPromptBtn = document.getElementById('addPromptBtn');
  const newPromptInput = document.getElementById('newPromptInput');
  const resetPromptsBtn = document.getElementById('resetPromptsBtn');
  const clearPromptsBtn = document.getElementById('clearPromptsBtn');
  const applyPromptsBtn = document.getElementById('applyPromptsBtn');
  // Merge Prompt panel elements
  const toggleMergePromptBtn = document.getElementById('toggleMergePromptPanel');
  const mergePromptPanel = document.getElementById('mergePromptPanel');
  const closeMergePromptPanelBtn = document.getElementById('closeMergePromptPanel');
  const mergePromptInputInline = document.getElementById('mergePromptInput');
  const mergePromptInputPanel = document.getElementById('mergePromptInputPanel');
  const resetMergePromptBtn = document.getElementById('resetMergePromptBtn');
  const applyMergePromptBtn = document.getElementById('applyMergePromptBtn');

  function renderPrompts(){
    promptsList.innerHTML='';
    const arr = CUSTOM_PROMPTS.length?CUSTOM_PROMPTS:DEFAULT_PROMPTS;
    arr.forEach((p,idx)=>{
      const row = document.createElement('div');
      row.style.display='flex';
      row.style.alignItems='center';
      row.style.gap='4px';
      row.style.marginBottom='4px';
      row.dataset.index=idx;
      row.draggable = true;
      row.addEventListener('dragstart', e=>{
        draggingIndex = idx;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(idx));
        row.style.opacity = '0.4';
      });
      row.addEventListener('dragend', ()=>{ row.style.opacity='1'; });
      row.addEventListener('dragover', e=>{
        e.preventDefault();
        e.dataTransfer.dropEffect='move';
        row.style.background = '#1f2937';
      });
      row.addEventListener('dragleave', ()=>{ row.style.background=''; });
      row.addEventListener('drop', e=>{
        e.preventDefault();
        row.style.background='';
        const from = draggingIndex;
        const to = parseInt(row.dataset.index);
        if(isNaN(from) || isNaN(to) || from===to) return;
        ensureCustom();
        const item = CUSTOM_PROMPTS.splice(from,1)[0];
        CUSTOM_PROMPTS.splice(to,0,item);
        draggingIndex = null;
  savePrompts();
  renderPrompts();
      });
      // drag handle
      const drag = document.createElement('span');
      drag.textContent='↕';
      drag.style.cursor='grab';
      drag.style.padding='0 4px';
      drag.style.background='#333';
      drag.style.borderRadius='4px';
  // line number indicator
  const num = document.createElement('span');
  num.textContent = (idx+1) + '.';
  num.style.minWidth='26px';
  num.style.textAlign='right';
  num.style.fontSize='11px';
  num.style.opacity='0.85';
  num.style.userSelect='none';
      // editable input
      const input = document.createElement('input');
      input.type='text';
      input.value=p;
      input.style.flex='1';
      input.style.background='#222';
      input.style.border='1px solid #555';
      input.style.color='#fff';
      input.style.borderRadius='4px';
      input.style.padding='2px 6px';
      input.addEventListener('change',()=>{
        ensureCustom();
        CUSTOM_PROMPTS[idx]=input.value.trim();
  savePrompts();
      });
      const del = document.createElement('button');
      del.textContent='X';
      del.style.background='#b91c1c';
      del.style.color='#fff';
      del.style.border='0';
      del.style.borderRadius='4px';
      del.style.cursor='pointer';
      del.style.padding='2px 6px';
      del.addEventListener('click',()=>{
        ensureCustom();
        CUSTOM_PROMPTS.splice(idx,1);
  savePrompts();
        renderPrompts();
      });
      // reorder buttons
      const up = document.createElement('button');
      up.textContent='↑';
      up.style.background='#4b5563'; up.style.color='#fff'; up.style.border='0'; up.style.borderRadius='4px'; up.style.cursor='pointer'; up.style.padding='2px 6px';
  up.addEventListener('click',()=>{ ensureCustom(); if(idx>0){ const t=CUSTOM_PROMPTS[idx-1]; CUSTOM_PROMPTS[idx-1]=CUSTOM_PROMPTS[idx]; CUSTOM_PROMPTS[idx]=t; savePrompts(); renderPrompts(); }});
      const down = document.createElement('button');
      down.textContent='↓';
      down.style.background='#4b5563'; down.style.color='#fff'; down.style.border='0'; down.style.borderRadius='4px'; down.style.cursor='pointer'; down.style.padding='2px 6px';
  down.addEventListener('click',()=>{ ensureCustom(); if(idx<CUSTOM_PROMPTS.length-1){ const t=CUSTOM_PROMPTS[idx+1]; CUSTOM_PROMPTS[idx+1]=CUSTOM_PROMPTS[idx]; CUSTOM_PROMPTS[idx]=t; savePrompts(); renderPrompts(); }});
      row.appendChild(drag);
  row.appendChild(num);
      row.appendChild(up);
      row.appendChild(down);
      row.appendChild(input);
      row.appendChild(del);
      promptsList.appendChild(row);
    });
  }
  function ensureCustom(){ if(!CUSTOM_PROMPTS.length){ CUSTOM_PROMPTS = DEFAULT_PROMPTS.slice(); } }
  let draggingIndex = null;
  togglePromptsBtn.addEventListener('click',()=>{ promptsPanel.style.display = (promptsPanel.style.display==='none'?'block':'none'); renderPrompts(); });
  closePromptsBtn.addEventListener('click',()=>{ promptsPanel.style.display='none'; });
  addPromptBtn.addEventListener('click',()=>{
    const v = newPromptInput.value.trim();
    if(!v) return;
    ensureCustom();
    CUSTOM_PROMPTS.push(v);
    newPromptInput.value='';
  savePrompts();
    renderPrompts();
  });
  newPromptInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ addPromptBtn.click(); }});
  resetPromptsBtn.addEventListener('click',()=>{ CUSTOM_PROMPTS = []; savePrompts(); renderPrompts(); });
  clearPromptsBtn.addEventListener('click',()=>{ CUSTOM_PROMPTS = []; promptsList.innerHTML=''; savePrompts(); });
  applyPromptsBtn.addEventListener('click',()=>{ notify('已应用自定义Prompts(下次生成生效)', '#2563eb'); promptsPanel.style.display='none'; });

  // ===== Merge Prompt Panel logic =====
  if(toggleMergePromptBtn){
    toggleMergePromptBtn.addEventListener('click',()=>{
      // 打开时把 inline 的值填入面板输入框
      if(mergePromptInputPanel && mergePromptInputInline){
        mergePromptInputPanel.value = (mergePromptInputInline.value||'').trim() || '合并所有不同的部分';
      }
      mergePromptPanel.style.display = (mergePromptPanel.style.display==='none' || mergePromptPanel.style.display==='') ? 'block' : 'none';
    });
  }
  if(closeMergePromptPanelBtn){ closeMergePromptPanelBtn.addEventListener('click',()=>{ mergePromptPanel.style.display='none'; }); }
  if(resetMergePromptBtn){
    resetMergePromptBtn.addEventListener('click',()=>{
      if(mergePromptInputPanel){ mergePromptInputPanel.value = '合并所有不同的部分'; }
    });
  }
  if(applyMergePromptBtn){
    applyMergePromptBtn.addEventListener('click',()=>{
      // 把面板值同步回 inline 输入框并保存设置
      const v = (mergePromptInputPanel?.value||'').trim();
      if(mergePromptInputInline){ mergePromptInputInline.value = v; }
      saveBackendSettings();
      notify('合并Prompt已保存', '#2563eb');
      mergePromptPanel.style.display='none';
    });
  }

  // ===== Corner Label Edit Events =====
  const toggleLabelEditBtn = document.getElementById('toggleLabelEdit');
  const labelEditContainer = document.getElementById('labelEditContainer');
  const saveCornerLabelBtn = document.getElementById('saveCornerLabelBtn');
  const resetCornerLabelBtn = document.getElementById('resetCornerLabelBtn');
  toggleLabelEditBtn.addEventListener('click',()=>{
    const show = labelEditContainer.style.display==='none' || labelEditContainer.style.display==='';
    labelEditContainer.style.display = show? 'flex':'none';
    if(show){ openLabelEditor(); }
  });
  saveCornerLabelBtn.addEventListener('click',()=>{
    const v1 = document.getElementById('cornerLineInput1').value.trim() || CORNER_DEFAULT_LINES[0];
    const v2 = document.getElementById('cornerLineInput2').value.trim() || CORNER_DEFAULT_LINES[1];
    const v3 = document.getElementById('cornerLineInput3').value.trim() || CORNER_DEFAULT_LINES[2];
    setCornerLines([v1,v2,v3]);
    saveCornerLabel();
    labelEditContainer.style.display='none';
    notify('标题已保存', '#2563eb');
  });
  resetCornerLabelBtn.addEventListener('click',()=>{
    setCornerLines(CORNER_DEFAULT_LINES.slice());
    saveCornerLabel();
    openLabelEditor();
  });

  // ===== Backend Switch Hidden Hotspot (5 single clicks) =====
  function applyBackendVisibility(){
    const hidden = localStorage.getItem('backend_switch_hidden')==='1';
    const panel = document.getElementById('backendSwitch');
    if(panel){ panel.classList.toggle('hidden', hidden); }
  }
  window.addEventListener('DOMContentLoaded', applyBackendVisibility);
  let backendDblCount = 0;
  let backendDblTimer = null;
  const hotspot = document.getElementById('backendToggleHotspot');
  if(hotspot){
    hotspot.addEventListener('click', ()=>{
      backendDblCount++;
      if(backendDblTimer) clearTimeout(backendDblTimer);
      backendDblTimer = setTimeout(()=>{ backendDblCount = 0; }, 3500);
      if(backendDblCount >= 5){
        const panel = document.getElementById('backendSwitch');
        if(panel){
          panel.classList.toggle('hidden');
          const isHidden = panel.classList.contains('hidden');
          try { localStorage.setItem('backend_switch_hidden', isHidden ? '1':'0'); } catch(e){}
        }
        backendDblCount = 0;
      }
    });
  }

  // 初始不拷贝，保持轻量；打开时再渲染默认
  
  </script>

</body>
